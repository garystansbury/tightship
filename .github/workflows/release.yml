# A tag is a release. Deployments pin a tag and fetch its binary; nothing else is ever deployed.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: web
        run: cd web && npm ci && npm run build
      - name: test
        run: go vet ./... && go test ./...
      - name: build linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags '-s -w -X main.version=${{ github.ref_name }}' -o tightship-linux-amd64 ./cmd/tightship
          sha256sum tightship-linux-amd64 > tightship-linux-amd64.sha256
          ./tightship-linux-amd64 version
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tightship-linux-amd64
            tightship-linux-amd64.sha256
            deploy/config.example.yaml
            deploy/tightship.service
          generate_release_notes: true
