# TightShip deployment file — layer 1: environment-specific, NON-secret settings.
# Copy to /etc/tightship/config.yaml and edit. Unknown keys are errors.
# Credentials never go here: upload them in Admin -> Credentials once the service is running.

org:
  name: Example County Schools      # shown on end-user-facing pages
  short: Example Schools
  timezone: America/New_York        # for display; storage is UTC

server:
  listen: 127.0.0.1:8090            # behind your reverse proxy, which terminates TLS
  public_url: https://app.example.org
  trusted_proxies: [10.0.0.10, 10.0.0.11]

database:
  host: 127.0.0.1
  port: 3306
  name: tightship
  user: tightship
  password_env: TIGHTSHIP_DB_PASSWORD   # bootstrap only; read once at start
  # Pool. Sized here because the right numbers depend on the server: max_connections is shared
  # with every other client, and several instances restarting at once must not exhaust it.
  max_open_conns: 25
  max_idle_conns: 25
  conn_max_lifetime: 30m                # well under MariaDB's wait_timeout, so the pool retires
  conn_max_idle_time: 5m                #   a connection before the server closes it underneath us
  connect_timeout: 10s

sessions:
  # Two limits answering different questions. idle_timeout is how long a session may sit unused —
  # what protects an unattended browser on a shared cart. absolute_lifetime is how long it may
  # live at all — what bounds a stolen cookie however often it is used. Use slides the first and
  # never extends the second.
  idle_timeout: 8h
  absolute_lifetime: 14d
  # The __Host- prefix is browser-enforced: it makes the cookie unsettable by any sibling
  # subdomain. Keep it.
  cookie_name: __Host-tightship_session

domains:
  staff: example.org
  students: students.example.org

mail:
  relay: mail.example.org:25
  from: tightship@example.org

secrets:
  master_key_file: /etc/tightship/master.key   # 32 random bytes; encrypts the credential store

# Modules this deployment runs. A module whose integration is not configured does not register.
modules:
  - core
  - helpdesk
  - chromebooks
  - identity

dev:
  allow_debug_identity: false       # NEVER true in production
